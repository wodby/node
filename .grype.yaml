# Temporary exceptions for the release scan, tracked in
# https://github.com/wodby/node/issues/23. Remove them by 2026-11-15.
#
# npm bundles vulnerable copies of these packages, and the latest npm releases
# still ship the same versions, so updating npm does not fix them. Each rule
# covers only npm's own copy; the same package anywhere else still fails.

# Keep accepted findings visible in scan reports.
show-suppressed: true

ignore:
  - vulnerability: CVE-2026-109869
    reason: undici bundled in npm; no npm release has the fix yet (wodby/node#23)
    package:
      name: undici
      version: 6.29.0
      type: npm
      location: /usr/local/lib/node_modules/npm/**
  - vulnerability: CVE-2026-87018
    reason: undici bundled in npm; no npm release has the fix yet (wodby/node#23)
    package:
      name: undici
      version: 6.29.0
      type: npm
      location: /usr/local/lib/node_modules/npm/**
