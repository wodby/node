name: Build docker image

on:
  pull_request:
  push:
    branches:
      - master

    tags:
      - '*'
      - '!*-r[0-9]*'

env:
  NODE26: '26.9.0'
  NODE24: '24.21.0'
  NODE22: '22.23.2'

jobs:
  node26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check scanned-image publication
        run: python3 tests/scanned-image-release.py
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          version: ${{ env.NODE26 }}
          tags: 26.9,26,latest
          platform: linux/amd64,linux/arm64
  node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          version: ${{ env.NODE24 }}
          tags: 24.21,24
          platform: linux/amd64,linux/arm64
  node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          version: ${{ env.NODE22 }}
          tags: 22.23,22
          platform: linux/amd64,linux/arm64
  node26-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          version: ${{ env.NODE26 }}
          tags: 26.9-dev,26-dev,dev
          dev: 1
          platform: linux/amd64,linux/arm64
  node24-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          version: ${{ env.NODE24 }}
          tags: 24.21-dev,24-dev
          dev: 1
          platform: linux/amd64,linux/arm64
  node22-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          version: ${{ env.NODE22 }}
          tags: 22.23-dev,22-dev
          dev: 1
          platform: linux/amd64,linux/arm64

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ node26, node24, node22, node26-dev, node24-dev, node22-dev ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@412e2d9ce29c41835ff653b0945bba72eabd9efb
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
